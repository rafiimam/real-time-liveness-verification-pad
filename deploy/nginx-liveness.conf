# Example Nginx reverse proxy for internet exposure (HTTPS required for mobile camera)
# IMPORTANT: /ws/ must use HTTP/1.1 + Upgrade or the browser falls back to GET → 404.
#
# TLS setup (Let's Encrypt example):
#   certbot certonly --nginx -d liveness.example.com
# Then uncomment the ssl_certificate lines below and reload nginx.

limit_req_zone $binary_remote_addr zone=liveness_api:10m rate=30r/m;

server {
    listen 80;
    server_name liveness.example.com;
    # Redirect all HTTP to HTTPS (camera requires secure context)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name liveness.example.com;

    ssl_certificate     /etc/letsencrypt/live/liveness.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liveness.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    # Live WebSocket (requires Upgrade headers)
    location /ws/ {
        proxy_pass http://127.0.0.1:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Mobile web UI
    location /app/ {
        proxy_pass http://127.0.0.1:8001/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API (incl. POST /verify fallback when WS is blocked)
    location / {
        limit_req zone=liveness_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
